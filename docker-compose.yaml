services:
  postgres:
    image: postgres:15
    container_name: blog-back-app-postgres
    environment:
      POSTGRES_DB: blog-back-app
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - blog_back_app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d blog-back-app"]
      interval: 10s
      timeout: 5s
      retries: 5

  my-blog-front-app:
    build: ./my-blog-front-app
    container_name: my-blog-front-app
    ports:
      - "80:80"
    volumes:
      - ./my-blog-front-app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - blog_back_app_net

volumes:
  postgres_data:
  uploads_data:

networks:
  blog_back_app_net:
    driver: bridge